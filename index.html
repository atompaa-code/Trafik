<!doctype html>
<html lang="sv">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f4f7f5">
  <meta name="description" content="Tid till jobb – en enkel startsida för ditt projekt.">
  <title>Tid till jobb</title>
  <style>
    :root {
      color-scheme: light;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: #18352b;
      background: #f4f7f5;
    }

    * { box-sizing: border-box; }

    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: 24px;
    }

    main {
      width: min(100%, 680px);
      padding: clamp(32px, 8vw, 64px);
      border: 1px solid #dce8e0;
      border-radius: 24px;
      background: #fff;
      box-shadow: 0 20px 60px rgb(24 53 43 / 8%);
    }

    .label {
      margin: 0 0 16px;
      color: #287452;
      font-size: .8rem;
      font-weight: 700;
      letter-spacing: .12em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      font-size: clamp(2.5rem, 8vw, 4.5rem);
      line-height: 1.05;
      letter-spacing: -.05em;
    }

    .intro {
      max-width: 46ch;
      margin: 24px 0 0;
      color: #52665c;
      font-size: 1.1rem;
      line-height: 1.7;
    }

    .status {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      margin-top: 36px;
      padding: 10px 14px;
      border-radius: 999px;
      background: #edf6f0;
      color: #287452;
      font-size: .9rem;
      font-weight: 600;
    }

    .dot {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: #39a56d;
    }
  </style>
</head>
<body>
  <main>
    <p class="label">Välkommen</p>
    <h1>Tid till jobb</h1>
    <p class="intro">Här är startsidan för projektet. Lägg till innehåll och funktioner här när du är redo.</p>
    <div class="status"><span class="dot" aria-hidden="true"></span>Publicerad med GitHub Pages</div>
  </main>
</body>
</html>
