<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Morgonkollen: Partille → SKF</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #121212;
      color: #f0f0f0;
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
    }
    header {
      background: #1e1e1e;
      padding: 10px 20px;
      border-bottom: 1px solid #333;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 10px;
      flex-shrink: 0;
    }
    header h1 { font-size: 1.1rem; font-weight: 600; }
    .route-badge {
      font-size: 0.85rem;
      background: #2c2c2c;
      padding: 4px 8px;
      border-radius: 6px;
      color: #bbb;
    }
    button {
      background: #2563eb;
      color: white;
      border: none;
      padding: 6px 12px;
      border-radius: 6px;
      cursor: pointer;
      font-weight: 500;
      font-size: 0.85rem;
    }
    button:hover { background: #1d4ed8; }

    /* Centrerade kameraremsor (över och under) */
    .cameras-strip {
      background: #181818;
      border-top: 1px solid #333;
      border-bottom: 1px solid #333;
      padding: 10px 20px;
      display: flex;
      justify-content: center; /* Centrerar bilderna */
      gap: 16px;
      overflow-x: auto;
      flex-shrink: 0;
    }
    .camera-card {
      background: #222;
      border: 1px solid #333;
      border-radius: 8px;
      overflow: hidden;
      min-width: 280px;
      max-width: 320px;
      flex-shrink: 0;
      display: flex;
      flex-direction: column;
    }
    .camera-card img {
      width: 100%;
      height: 150px;
      display: block;
      background: #000;
      object-fit: cover;
    }
    .camera-info {
      padding: 8px 12px;
      font-size: 0.85rem;
      display: flex;
      justify-content: space-between;
      color: #ccc;
      background: #1e1e1e;
    }

    /* Huvudinnehåll (Karta + Panel) */
    .main-container {
      display: flex;
      flex: 1;
      overflow: hidden;
    }
    #map {
      flex: 1;
      height: 100%;
      background: #1a1a1a;
    }
    .dark-tiles {
      filter: invert(100%) hue-rotate(180deg) brightness(92%) contrast(90%);
    }
    .sidebar {
      width: 350px;
      background: #181818;
      border-left: 1px solid #333;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      overflow-y: auto;
      flex-shrink: 0;
    }
    h2 {
      font-size: 0.9rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: #9ca3af;
      margin-bottom: 8px;
    }

    .routes-info-box {
      background: #222;
      border: 1px solid #333;
      border-radius: 8px;
      padding: 10px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .route-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 8px 10px;
      background: #1b1b1b;
      border-radius: 6px;
      border-left: 4px solid #555;
      font-size: 0.85rem;
    }
    .route-row.e20 { border-left-color: #3b82f6; }
    .route-row.savedalen { border-left-color: #f59e0b; }
    .route-row.utby { border-left-color: #10b981; }

    .route-name { font-weight: 600; color: #fff; }
    .route-time { font-size: 1rem; font-weight: bold; color: #4ade80; }

    .error-msg {
      background: #3f2e12;
      border: 1px solid #d97706;
      color: #fcd34d;
      padding: 10px;
      border-radius: 6px;
      font-size: 0.8rem;
    }
  </style>
</head>
<body>
  <header>
    <div>
      <h1>Morgonkollen</h1>
      <span class="route-badge">Bisittarevägen 21 → SKF, Gamlestaden</span>
    </div>
    <div>
      <button onclick="updateAllData()">Uppdatera nu</button>
    </div>
  </header>

  <!-- Kameror överst (centrerade) -->
  <div id="cameras-strip-top" class="cameras-strip">
    <p style="color:#777; font-size:0.85rem;">Laddar kameror...</p>
  </div>

  <div class="main-container">
    <div id="map"></div>
    <div class="sidebar">
      <div id="api-warning"></div>

      <div>
        <h2>Beräknad körtid</h2>
        <div id="routes-summary" class="routes-info-box">
          <p style="color:#777; font-size:0.85rem;">Beräknar rutter...</p>
        </div>
      </div>
    </div>
  </div>

  <!-- Kameror underst (centrerade) -->
  <div id="cameras-strip-bottom" class="cameras-strip" style="border-top: 1px solid #333; border-bottom: none;">
    <p style="color:#777; font-size:0.85rem;"></p>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script>
    const TRAFIKVERKET_API_KEY = "6abeeceef43f457698f0983769a17cf2";

    const START_COORDS = [57.7376, 12.1128]; // Bisittarevägen 21, Partille
    const END_COORDS   = [57.7289, 12.0086]; // SKF, Gamlestaden

    const map = L.map('map').setView([57.733, 12.060], 13);

    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      attribution: '&copy; OpenStreetMap',
      maxZoom: 19,
      className: 'dark-tiles'
    }).addTo(map);

    L.marker(START_COORDS).addTo(map).bindPopup("<b>Start:</b> Bisittarevägen 21, Partille");
    L.marker(END_COORDS).addTo(map).bindPopup("<b>Mål:</b> SKF, Gamlestaden");

    let cameraLayerGroup = L.layerGroup().addTo(map);

    async function updateRoutes() {
      const summaryEl = document.getElementById('routes-summary');

      try {
        const resE20 = await fetch(`https://router.project-osrm.org/route/v1/driving/${START_COORDS[1]},${START_COORDS[0]};${END_COORDS[1]},${END_COORDS[0]}?overview=false`);
        const dataE20 = await resE20.json();

        const resSavedalen = await fetch(`https://router.project-osrm.org/route/v1/driving/${START_COORDS[1]},${START_COORDS[0]};12.0700,57.7375;${END_COORDS[1]},${END_COORDS[0]}?overview=false`);
        const dataSavedalen = await resSavedalen.json();

        const resUtby = await fetch(`https://router.project-osrm.org/route/v1/driving/${START_COORDS[1]},${START_COORDS[0]};12.0500,57.7425;${END_COORDS[1]},${END_COORDS[0]}?overview=false`);
        const dataUtby = await resUtby.json();

        if (dataE20.routes && dataSavedalen.routes && dataUtby.routes) {
          const tE20 = Math.round(dataE20.routes[0].duration / 60);
          const dE20 = (dataE20.routes[0].distance / 1000).toFixed(1);

          const tSavedalen = Math.round(dataSavedalen.routes[0].duration / 60);
          const dSavedalen = (dataSavedalen.routes[0].distance / 1000).toFixed(1);

          const tUtby = Math.round(dataUtby.routes[0].duration / 60);
          const dUtby = (dataUtby.routes[0].distance / 1000).toFixed(1);

          summaryEl.innerHTML = `
            <div class="route-row e20">
              <div>
                <div class="route-name">E20 (Huvudled)</div>
                <div style="font-size:0.75rem; color:#aaa;">${dE20} km</div>
              </div>
              <div class="route-time">${tE20} min</div>
            </div>
            <div class="route-row savedalen">
              <div>
                <div class="route-name">Via Tillfällavägen</div>
                <div style="font-size:0.75rem; color:#aaa;">${dSavedalen} km</div>
              </div>
              <div class="route-time">${tSavedalen} min</div>
            </div>
            <div class="route-row utby">
              <div>
                <div class="route-name">Via Utbyvägen</div>
                <div style="font-size:0.75rem; color:#aaa;">${dUtby} km</div>
              </div>
              <div class="route-time">${tUtby} min</div>
            </div>
          `;
        }
      } catch (err) {
        console.error("Kunde inte hämta rutter:", err);
        summaryEl.innerHTML = `<p style="color:#ef4444; font-size:0.85rem;">Kunde inte beräkna restid.</p>`;
      }
    }

    async function loadTrafficCameras() {
      const warningEl = document.getElementById('api-warning');
      const topStrip = document.getElementById('cameras-strip-top');
      const bottomStrip = document.getElementById('cameras-strip-bottom');

      if (!TRAFIKVERKET_API_KEY || TRAFIKVERKET_API_KEY === "DIN_API_NYCKEL_HÄR") {
        warningEl.innerHTML = `
          <div class="error-msg">
            <strong>API-nyckel saknas!</strong> Klistra in din nyckel i koden.
          </div>`;
        topStrip.innerHTML = `<p style="color:#888; font-size:0.85rem; padding: 10px;">Inga kameror att visa.</p>`;
        bottomStrip.innerHTML = "";
        return;
      }

      warningEl.innerHTML = "";
      cameraLayerGroup.clearLayers();

      const xmlQuery = `
        <REQUEST>
          <LOGIN authenticationkey="${TRAFIKVERKET_API_KEY.trim()}" />
          <QUERY objecttype="Camera" schemaversion="1">
            <FILTER>
              <WITHIN name="Geometry.WGS84" shape="box" value="11.98 57.71, 12.15 57.76" />
            </FILTER>
            <INCLUDE>Id</INCLUDE>
            <INCLUDE>Name</INCLUDE>
            <INCLUDE>PhotoUrl</INCLUDE>
            <INCLUDE>PhotoTime</INCLUDE>
            <INCLUDE>Geometry.WGS84</INCLUDE>
          </QUERY>
        </REQUEST>
      `;

      try {
        const response = await fetch("https://api.trafikinfo.trafikverket.se/v2/data.json", {
          method: "POST",
          headers: { "Content-Type": "text/xml" },
          body: xmlQuery
        });

        const result = await response.json();
        const allCameras = result.RESPONSE.RESULT[0]?.Camera || [];

        const allowedKeywords = ['partille allum', 'partillemotet', 'torpamotet', 'munkebäcksmotet'];
        let cameras = allCameras
          .filter(cam => {
            const name = (cam.Name || '').toLowerCase();
            return allowedKeywords.some(keyword => name.includes(keyword));
          })
          .sort((a, b) => {
            const getLon = c => parseFloat(c.Geometry?.WGS84?.match(/POINT\s*\(([\d.]+)/)?.[1] || 0);
            return getLon(b) - getLon(a);
          });

        if (cameras.length === 0) {
          topStrip.innerHTML = `<p style="color:#888; font-size:0.85rem; padding: 10px;">Inga matchande kameror hittades.</p>`;
          bottomStrip.innerHTML = "";
        } else {
          topStrip.innerHTML = "";
          bottomStrip.innerHTML = "";
          const cacheBuster = Date.now();

          const midPoint = Math.ceil(cameras.length / 2);
          const topCameras = cameras.slice(0, midPoint);
          const bottomCameras = cameras.slice(midPoint);

          cameras.forEach(cam => {
            const match = cam.Geometry?.WGS84?.match(/POINT\s*\(([\d.]+)\s+([\d.]+)\)/);
            if (match) {
              const lon = parseFloat(match[1]);
              const lat = parseFloat(match[2]);

              const camIcon = L.divIcon({
                html: '📷',
                className: 'cam-map-icon',
                iconSize: [24, 24]
              });

              L.marker([lat, lon], { icon: camIcon })
                .addTo(cameraLayerGroup)
                .bindPopup(`
                  <div style="color:#111; max-width:260px;">
                    <strong>${cam.Name}</strong><br>
                    <img src="${cam.PhotoUrl}?t=${cacheBuster}" style="width:100%; margin-top:6px; border-radius:4px;" />
                  </div>
                `);
            }
          });

          topCameras.forEach(cam => {
            const timeStr = cam.PhotoTime ? new Date(cam.PhotoTime).toLocaleTimeString('sv-SE', {hour: '2-digit', minute:'2-digit'}) : '';
            topStrip.innerHTML += `
              <div class="camera-card">
                <img src="${cam.PhotoUrl}?t=${cacheBuster}" alt="${cam.Name}" loading="lazy" />
                <div class="camera-info">
                  <span>${cam.Name}</span>
                  <span>Kl. ${timeStr}</span>
                </div>
              </div>
            `;
          });

          bottomCameras.forEach(cam => {
            const timeStr = cam.PhotoTime ? new Date(cam.PhotoTime).toLocaleTimeString('sv-SE', {hour: '2-digit', minute:'2-digit'}) : '';
            bottomStrip.innerHTML += `
              <div class="camera-card">
                <img src="${cam.PhotoUrl}?t=${cacheBuster}" alt="${cam.Name}" loading="lazy" />
                <div class="camera-info">
                  <span>${cam.Name}</span>
                  <span>Kl. ${timeStr}</span>
                </div>
              </div>
            `;
          });
        }
      } catch (err) {
        console.error(err);
        warningEl.innerHTML = `<div class="error-msg"><strong>Fel från API:</strong> ${err.message}</div>`;
      }
    }

    function updateAllData() {
      updateRoutes();
      loadTrafficCameras();
    }

    updateAllData();
  </script>
</body>
</html>
